base_url = "https://floreal.tech"
title = "Floréal Technologies"
description = "Floréal Technologies: Open software, French touch, International reach."

default_language = "en-GB"
theme = "floreal"
compile_sass = true
build_search_index = false
generate_feeds = false

taxonomies = [
    {name = "categories", feed = true},
    {name = "tags"},
    {name = "authors"}
]

[markdown.highlighting]
theme = "catppuccin-mocha"
style = "class"

[languages.fr]
title = "Floréal Technologies"
description = "Floréal Technologies: Open software, French touch, International reach."

[extra]
logo = "img/floreal-tech-logo.svg"

# Which backdrop a first-time visitor sees.
default_backdrop = "path"

# The order of the language nav.
language_order = ["en-GB", "fr"]

# What each language is called in that nav.
[extra.language_labels]
en-GB = "English"
fr = "Français"

[extra.labels.en-GB]
about = "About"
projects = "Projects"
blog = "Blog"
categories = "Categories"
tags = "Tags"
authors = "Authors"
path = "Path"
mountains = "Mountains"

[extra.labels.fr]
about = "À propos"
projects = "Projets"
blog = "Journal"
categories = "Catégories"
tags = "Étiquettes"
authors = "Auteurs"
path = "Sentier"
mountains = "Montagnes"

# The theme strings. English ships with the theme, so only the words this site
# says differently are here.
[extra.strings.en-GB]
friends = "Our friends:"
not_found = "This page does not exist."
back_home = "Back to the home page"

[extra.strings.fr]
language_nav = "Langue"
background_nav = "Fond"
nav_label = "Pages"
pagination_nav = "Pages d'articles"
newer = "Plus récents"
older = "Plus anciens"
article_nav = "Autres articles"
newer_article = "Plus récent"
older_article = "Plus ancien"
home_label = "Accueil"
breadcrumb_nav = "Fil d'Ariane"
friends = "Nos amis :"
not_found = "Cette page n'existe pas."
back_home = "Retour à l'accueil"

[extra.backdrop_credits.en-GB]
path = '''Background: <em>Path</em> by Risto Saukonpää, from the KDE Plasma wallpapers, <a href="/licenses/LGPL-3.0.txt">LGPL-3.0</a>.'''
mountains = '''Background: aerial photograph by John Towner, from <a href="https://unsplash.com/photos/JgOeRuGD_Y4">Unsplash</a>.'''

[extra.backdrop_credits.fr]
