base_url = "https://floreal.tech"
title = "Floréal Technologies"
description = "Floréal Technologies: Open software, French touch, International reach."

default_language = "en"
theme = "floreal"
compile_sass = true
build_search_index = false
generate_feeds = false

taxonomies = [
    {name = "categories", feed = true},
    {name = "tags"},
    {name = "authors"}
]

# English, the default language.
[translations]
language_nav = "Language"
background_nav = "Background"
nav_label = "Pages"
pagination_nav = "Pages of articles"
newer = "Newer"
older = "Older"
article_nav = "Other articles"
newer_article = "Newer"
older_article = "Older"
home_label = "Home"
breadcrumb_nav = "Breadcrumb"
friends = "Our friends:"
not_found = "This page does not exist."
back_home = "Back to the home page"

[languages.fr]
title = "Floréal Technologies"
description = "Floréal Technologies: Open software, French touch, International reach."

[languages.fr.translations]
language_nav = "Langue"
background_nav = "Fond"
nav_label = "Pages"
pagination_nav = "Pages d'articles"
newer = "Plus récents"
older = "Plus anciens"
article_nav = "Autres articles"
newer_article = "Plus récent"
older_article = "Plus ancien"
home_label = "Accueil"
breadcrumb_nav = "Fil d'Ariane"
friends = "Nos amis :"
not_found = "Cette page n'existe pas."
back_home = "Retour à l'accueil"

[extra]
# Which backdrop a first-time visitor sees.
default_backdrop = "path"

# What each photo is called in the switcher, and the line that credits it.
[extra.backdrop_labels.en]
path = "Path"
mountains = "Mountains"

[extra.backdrop_labels.fr]
path = "Sentier"
mountains = "Montagnes"

[extra.backdrop_credits.en]
path = '''Background: <em>Path</em> by Risto Saukonpää, from the KDE Plasma wallpapers, <a href="/licenses/LGPL-3.0.txt">LGPL-3.0</a>.'''
mountains = '''Background: aerial photograph by John Towner, from <a href="https://unsplash.com/photos/JgOeRuGD_Y4">Unsplash</a>.'''

[extra.backdrop_credits.fr]
path = '''Bannière de fond : <em>Path</em> de Risto Saukonpää, tirée des fonds d'écran de KDE Plasma, <a href="/licenses/LGPL-3.0.txt">LGPL-3.0</a>.'''
mountains = '''Bannière de fond : photographie aérienne de John Towner, tirée d'<a href="https://unsplash.com/photos/JgOeRuGD_Y4">Unsplash</a>.'''

# What each taxonomy is called on its own pages, per language. A taxonomy named
# nowhere here is written out as it stands: "authors" becomes "Authors".
[extra.taxonomy_labels.en]
categories = "Categories"
tags = "Tags"
authors = "Authors"

[extra.taxonomy_labels.fr]
categories = "Catégories"
tags = "Étiquettes"
authors = "Auteurs"

# The pages the header bar links to, in the order it shows them. One list
# serves both languages: "blog/" is /blog/ in English, /fr/blog/ in French.
[[extra.nav]]
key = "about"
path = "about/"

[[extra.nav]]
key = "products"
path = "products/"

[[extra.nav]]
key = "blog"
path = "blog/"

# What each entry of the bar is called, per language.
[extra.nav_labels.en]
about = "About"
products = "Products"
blog = "Blog"

[extra.nav_labels.fr]
about = "À propos"
products = "Produits"
blog = "Journal"

[[extra.friends]]
name = "Guérilla.Studio"
url = "https://guerilla.studio"

[[extra.friends]]
name = "Institute for Digital Autonomy"
url = "https://digital-autonomy.institute/"

# Two fixed URLs, so the language nav is listed rather than derived.
[[extra.languages]]
code = "en"
label = "English"
path = "/"

[[extra.languages]]
code = "fr"
label = "Français"
path = "/fr/"

# The single source for the <picture> srcsets, the switcher buttons and the
# table that floreal.js reads. The paths are relative to `static/`; the
# templates run them through get_url(). A backdrop carries its own palette; its
# name and its credit line are in the two tables above.
[[extra.backdrops]]
id = "path"
base = "img/path-"
widths = [1000, 1600, 2560]
width = 2560
height = 1600

# The colours this photo is read against. Every one of them becomes a custom
# property on html[data-theme="path"].
[extra.backdrops.palette]
ink = "oklch(96.35% 0.0073 132.42)"
ink-dim = "oklch(80.78% 0.0228 138.98)"
line = "rgba(241, 244, 239, 0.18)"
tint = "rgba(241, 244, 239, 0.1)"
card = "rgba(8, 15, 9, 0.62)"
card-solid = "rgba(8, 15, 9, 0.9)"
accent = "oklch(82.63% 0.1221 137.67)"
sand = "oklch(82.77% 0.0638 73.81)"
sand-lift = "oklch(88.34% 0.0514 72.83)"
on-sand = "oklch(22.34% 0.0329 64.74)"
bg = "oklch(15.02% 0.0148 150.01)"
focus-pos = "32% 62%"
scrim = "radial-gradient(130% 100% at 30% 35%, rgba(7, 13, 8, 0.05) 0%, rgba(7, 13, 8, 0.45) 65%, rgba(7, 13, 8, 0.72) 100%), linear-gradient(to bottom, rgba(7, 13, 8, 0.45), rgba(7, 13, 8, 0.2) 45%, rgba(7, 13, 8, 0.7))"

[[extra.backdrops]]
id = "mountains"
base = "img/mountains-"
widths = [1000, 1600, 2560]
width = 2560
height = 1708

[extra.backdrops.palette]
ink = "oklch(96.2% 0.0055 275)"
ink-dim = "oklch(80.5% 0.018 272)"
line = "rgba(233, 236, 245, 0.18)"
tint = "rgba(233, 236, 245, 0.1)"
card = "rgba(9, 10, 20, 0.62)"
card-solid = "rgba(9, 10, 20, 0.9)"
accent = "oklch(80% 0.11 25)"
sand = "oklch(83% 0.07 32)"
sand-lift = "oklch(88.5% 0.056 33)"
on-sand = "oklch(24% 0.04 25)"
bg = "oklch(16.5% 0.022 275)"
focus-pos = "50% 55%"
# Lighter than the path scrim: the photo is already dark. The top stays
# dimmed, because the sky sits behind the title.
scrim = "radial-gradient(120% 90% at 50% 20%, rgba(6, 8, 16, 0.22) 0%, rgba(6, 8, 16, 0.18) 55%, rgba(6, 8, 16, 0.5) 100%), linear-gradient(to bottom, rgba(6, 8, 16, 0.5), rgba(6, 8, 16, 0.1) 45%, rgba(6, 8, 16, 0.5))"
